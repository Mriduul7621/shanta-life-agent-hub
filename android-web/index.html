<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3C3C3B" />
    <title>Agent Hub — No connection</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f7f5f0;
        color: #3c3c3b;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        width: 100%;
        text-align: center;
      }
      .mark { margin: 0 auto 20px; }
      h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
      p { font-size: 15px; line-height: 1.5; color: #575756; margin-bottom: 6px; }
      .bn { font-size: 14px; }
      button {
        margin-top: 20px;
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #f37021;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        padding: 12px 32px;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
      .hint { margin-top: 16px; font-size: 13px; color: #8a8a89; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="mark" width="72" height="72" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#3C3C3B" />
        <circle cx="256" cy="256" r="72" fill="#F37021" />
        <circle cx="256" cy="256" r="72" fill="none" stroke="#F7F5F0" stroke-width="8" />
        <g stroke="#978C21" stroke-width="22" stroke-linecap="round">
          <line x1="256" y1="150" x2="256" y2="178" />
          <line x1="256" y1="334" x2="256" y2="362" />
          <line x1="150" y1="256" x2="178" y2="256" />
          <line x1="334" y1="256" x2="362" y2="256" />
        </g>
        <g fill="#F7F5F0">
          <circle cx="256" cy="142" r="15" />
          <circle cx="256" cy="370" r="15" />
          <circle cx="142" cy="256" r="15" />
          <circle cx="370" cy="256" r="15" />
        </g>
      </svg>
      <h1>No connection</h1>
      <p>Agent Hub needs the internet. Check your mobile data or Wi-Fi and try again.</p>
      <p class="bn">ইন্টারনেট সংযোগ নেই। মোবাইল ডেটা বা Wi-Fi চালু করে আবার চেষ্টা করো।</p>
      <button type="button" id="retry">Retry</button>
      <p class="hint">If the app looks out of date, close it fully and reopen it.</p>
    </div>
    <script>
      // The shell loads the live Hub remotely; this page only exists for
      // the offline case, so a retry is a full navigation to the live URL
      // (which also clears any stale deployment the WebView was pinned to).
      var HUB_URL = "https://shanta-life-agent-hub.vercel.app";
      document.getElementById("retry").addEventListener("click", function () {
        window.location.href = HUB_URL;
      });
      // Recover automatically the moment connectivity returns.
      window.addEventListener("online", function () {
        window.location.href = HUB_URL;
      });
    </script>
  </body>
</html>
