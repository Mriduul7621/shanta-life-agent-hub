# Agent Hub Android version — the single source of truth for the release
# version. CI reads this file; it is NEVER derived from github.run_number
# (the Learning Hub lesson: recreating the workflow restarts run numbers
# and silently produces downgrade builds that Android refuses to install).
#
# Bump rule: every release build bumps versionCode by exactly 1 and
# versionName per the release; the release notes name both. versionCode
# must only ever go up — Android refuses to install over a build with a
# higher versionCode (INSTALL_FAILED_VERSION_DOWNGRADE).
#
# First release: versionCode 1, versionName 1.0.0. The Hub has no
# installed base (confirmed by Mahadi 2026-11-20), so release 1 is a
# clean first install — no migration, nothing to outrank.
versionCode=1
versionName=1.0.0
